<!doctype html>
<html lang="th">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GAME FRIENDS — พรีวิวตัวละครและธีม</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#151d30;color:#f3f4f7;font:15px system-ui,sans-serif}header{max-width:1520px;margin:auto;padding:28px 28px 22px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}h1{font-size:26px;margin:0}p{color:#a9b7cc;margin:8px 0 0;font-size:14px}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}select,button{font:inherit;color:inherit;border:1px solid #52607a;border-radius:8px;background:#26334c;padding:9px 14px;cursor:pointer}button:hover{background:#354767}main{max-width:1520px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:0 28px 28px}section{overflow:hidden;border-radius:12px;background:#202b40}h2{font-size:13px;letter-spacing:1.3px;margin:15px 18px}canvas{width:100%;display:block}.characters{grid-column:1/-1}@media(max-width:760px){main{grid-template-columns:1fr;padding:0 12px 18px}header{padding:20px 16px}h1{font-size:22px}.characters{overflow-x:auto}.characters canvas{min-width:760px}}
</style>
<header><div><h1>GAME FRIENDS / ART PREVIEW</h1><p>ตัวละครมุมบนชุดเดียวกัน • ฟาร์ม • ลาวา • สวนผลไม้ • สุสาน • อียิปต์</p></div><div class="controls"><label for="count">ผู้เล่น</label><select id="count"><option>4</option><option>8</option><option>12</option></select><button id="motion" type="button" aria-pressed="false">ดูท่าเดิน</button><button id="reset" type="button">สุ่มสนามใหม่</button></div></header>
<main></main>
<script src="../arena-art.js"></script>
<script src="../player-avatar.js"></script>
<script src="../combat-motion.js"></script>
<script src="../graveyard-art.js"></script>
<script src="../ghost-attack.js"></script>
<script src="../chickens.js"></script>
<script src="../fruit-memory.js"></script>
<script src="../shockwave.js"></script>
<script>
/* Local art review only. Uses real engines, no PeerJS, rooms or network state.
   Example phases are frozen so art can be compared without changing game rules. */
(() => {
 const colors=['#ff628c','#3fe4ef','#ffcf62','#ae94ff','#8be493','#ff986a',
   '#709fff','#eb9cea','#d1e765','#54d7bf','#dcb893','#f589a3'];
 const main=document.querySelector('main');let scenes=[],moving=false,castCanvas;
 const players=n=>Array.from({length:n},(_,i)=>({id:'p'+(i+1),name:'P'+(i+1),
   color:colors[i],active:true,type:'bot',isBot:true,input:{},score:0}));
 function canvas(title,w=960,h=540){
  const section=document.createElement('section');if(w===1360)section.className='characters';
  const heading=document.createElement('h2');heading.textContent=title;section.append(heading);
  const c=document.createElement('canvas');c.width=w*2;c.height=h*2;c.setAttribute('aria-label',title);
  c.getContext('2d').scale(2,2);section.append(c);main.append(section);return c;
 }
 function build(){
  scenes=[];main.replaceChildren();
  castCanvas=canvas('ตัวละคร 4 แบบ / 4 ทิศ / เดิน · อุ้ม · ตี',1360,150);
  PartyPlayerAvatar.preload(players(4));
  const themes=[['CHICKENS / ฟาร์ม','Chickens'],['SHOCKWAVE / วิหารลาวา','Shockwave'],
    ['FRUIT MEMORY / สวนผลไม้','FruitMemory'],['GHOST ATTACK / สุสาน','GhostAttack','graveyard'],
    ['GHOST ATTACK / อียิปต์','GhostAttack','egypt']];
  for(const [title,key,theme] of themes){
   const ps=players(Number(document.querySelector('#count').value)),round={phase:'countdown',countdown:3},engine=window[key];
   engine.setup(round,ps);
   // Ghost rounds alternate themes; one retry builds matching prop geometry.
   if(theme&&round.ghost.theme!==theme)engine.setup(round,ps);
   round.phase='playing';
   if(key==='Shockwave'){
    engine.startWave(round.shockwave,ps);engine.startWarning(round.shockwave,ps);
    round.shockwave.clock=1.2;
   }
   if(key==='Chickens'){
    const chicken=round.chickens.chickens[0],p=ps[0];
    p.carriedChickenId=chicken.id;p.dir={x:1,y:0};
    Object.assign(chicken,{status:'carried',carrierId:p.id,dir:p.dir,x:p.x+37,y:p.y});
   }
   if(key==='FruitMemory')round.fruitMemory.elapsed=.5;
   if(theme){round.ghost.ghostSpawned=true;GhostCemeteryArt.preload(ps,theme);}
   PartyPlayerAvatar.preload(ps);
   scenes.push({canvas:canvas(title),engine,round,players:ps});
  }
  paint(0);
 }
 function paint(time){
  const c=castCanvas.getContext('2d');c.clearRect(0,0,1360,150);
  const cast=players(4);
  for(let i=0;i<4;i++)for(let d=0;d<4;d++){
   const p={...cast[i],x:45+i*340+d*78,y:75,dir:{x:Math.sin(d*Math.PI/2),y:-Math.cos(d*Math.PI/2)},vx:moving?90:0};
   PartyPlayerAvatar.draw(c,p,{scale:1.5,label:false,time,holding:d===2,attacking:d===3});
  }
  for(const scene of scenes){
   for(const p of scene.players)p.vx=moving?90:0;
   scene.engine.draw(scene.canvas.getContext('2d'),time,scene.round,scene.players);
  }
 }
 document.querySelector('#count').addEventListener('change',build);
 document.querySelector('#reset').addEventListener('click',build);
 document.querySelector('#motion').addEventListener('click',e=>{
  moving=!moving;e.currentTarget.setAttribute('aria-pressed',String(moving));
  e.currentTarget.textContent=moving?'หยุดท่าเดิน':'ดูท่าเดิน';
 });
 build();let last=-1;
 // 30fps is enough for a gallery; pause all work in hidden tabs.
 function frame(ms){if(!document.hidden&&ms-last>33){paint(moving?ms/1000:1.2);last=ms;}requestAnimationFrame(frame);}
 requestAnimationFrame(frame);
})();
</script>
</html>
