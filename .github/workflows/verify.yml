name: Verify static game
on:
  push:
    branches: [main, fix/chickens-finite-flock-lobby-20261105, feat/chickens-game2-20261105, feat/stick-squad-party, feat/party-minigames-topdown, feat/landscape-analog-ab-minigame-picker, feat/portrait-virtual-landscape-pad, feat/saved-controller-name-switch-room, fix/dismiss-joystick-hint-on-first-touch, feat/phone-game-preview-compact-hud-confirm-exit, feat/player-picked-shuffled-party-queue, feat/large-live-webrtc-video-controller-only, fix/single-viewport-no-scroll-all-screens, fix/controller-fill-landscape-viewport, fix/compact-host-roster-stacked-qr-link, fix/controller-quality-cycle-unified-preview, feat/resolution-only-video-quality-auto, fix/persist-fullscreen-across-exits, feat/ghost-attack-first-game, fix/ghost-controller-hud-top-preview-offset, fix/host-game-hud-above-field, feat/ghost-loot-pickup-feedback-and-top-roster]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore BOARD PARTY v7 source assets
        run: node scripts/build-board-v7.cjs
      - name: Audit BOARD PARTY island density, crossings and swords
        run: node tests/board-layout-audit.cjs
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check arena-scale.js
          node --check tests/map-scale-regression.cjs
          node --check tests/map-scale-browser.cjs
          node --check arena-art.js
          node --check player-avatar.js
          node --check ghost-attack.js
          node --check chickens.js
          node --check fruit-memory.js
          node --check shockwave.js
          node --check color-switch-mayan.js
          node --check color-switch.js
          node --check knight-match.js
          node --check boulder-bash.js
          node --check snow-brawl.js
          node --check farm-ice-art.js
          node --check tests/farm-ice.cjs
          node --check tests/farm-ice-browser.cjs
          node --check party-arena-scenes.js
          node --check game-cover-art.js
          node --check tests/party-arenas.cjs
          node --check tests/party-arenas-browser.cjs
          node --check shopping-time.js
          node --check pizza-time.js
          node --check pizza-kitchen-art.js
          node --check tests/pizza-kitchen.cjs
          node --check tests/pizza-kitchen-browser.cjs
          node --check tests/shopping-time.cjs
          node --check tests/snow-brawl.cjs
          node --check color-claim.js
          node --check tests/color-claim.cjs
          node --check witching-snake.js
          node --check lawn-mower.js
          node --check tests/lawn-mower.cjs
          node --check tests/witching-snake.test.cjs
          node --check tests/boulder-bash.cjs
          node --check tests/knight-match.cjs
          node --check tests/color-switch.test.js
          node --check tests/avatar-topdown.cjs
          node --check tests/shockwave.cjs
          node --check tests/fruit-memory.cjs
          node --check tests/chickens.cjs
          node --check tests/lobby-start.cjs
          node --check tests/lobby-stability-browser.cjs
          node --check tests/ipad-statusbar.cjs
          node --check tests/combat-motion.cjs
          node --check auto-update.js
          node --check scripts/build-board-v7.cjs
          node --check scripts/build-static.cjs
      - name: Global map scale and character proportions for all 1–12-player modes
        run: node tests/map-scale-regression.cjs
      - name: LAWN MOWER 1–12 player race and sun distribution checks
        run: node tests/lawn-mower.cjs
      - name: Original covers, scene geometry, exact lance tips and 1–12-player rounds
        run: node tests/party-arenas.cjs
      - name: SHOPPING TIME conveyor physics, checkout, bombs and bot regressions
        run: node tests/shopping-time.cjs
      - name: PIZZA TIME garden kitchen, serving and 1–12-player bot rounds
        run: |
          node tests/pizza-time.test.cjs
          node tests/pizza-kitchen.cjs
          node tests/svg-only-policy.cjs
      - name: BOULDER BASH fixed-step physics and multiplayer survival
        run: node tests/boulder-bash.cjs
      - name: COLOR CLAIM 60 Hz territory, sweep, freeze and board integration
        run: node tests/color-claim.cjs
      - name: WITCHING SNAKE 60 Hz broom survival and integration checks
        run: node tests/witching-snake.test.cjs
      - name: SNOW BRAWL fixed-step physics, momentum and rolling-speed checks
        run: node tests/snow-brawl.cjs
      - name: KNIGHT MATCH balloon lifecycle and 1–12 player regressions
        run: node tests/knight-match.cjs
      - name: BOARD PARTY rules and simulations
        run: |
          for source in board-*.js; do node --check "$source"; done
          node tests/board-v7.cjs
          node tests/board-v8-layout.cjs
          node tests/board-party.cjs
          node tests/board-art.cjs
          node tests/board-dice-renderer.cjs
          node tests/board-christmas-svg.cjs
          node tests/board-layout.cjs
          node tests/board-fixed.cjs
          node tests/board-expedition.cjs
      - name: "Central character combat: 0.8-second stun and attacker-colored VFX"
        run: node tests/combat-motion.cjs
      - name: iPadOS Home Screen and native fullscreen status-bar regression
        run: node tests/ipad-statusbar.cjs
      - name: Runtime smoke test
        run: node tests/smoke.cjs
      - name: GHOST ATTACK courtyards, wall collisions, reachable lanes and 1–12 bots
        run: node tests/ghost-courtyards.cjs
      - name: BOARD PARTY phone double-tap camera gestures
        run: node tests/board-camera-controller.cjs
      - name: Lobby controller-A readiness and layout
        run: node tests/lobby-start.cjs
      - name: COLOR SWITCH rules and 12-player stress
        run: node tests/color-switch.test.js
      - name: Mayan skull theme and 15 percent bot nerf
        run: node tests/color-switch-mayan.test.js
      - name: Shared overhead avatar checks
        run: node tests/avatar-topdown.cjs
      - name: Scenery cache and physics isolation
        run: node tests/arena-art.cjs
      - name: Shockwave survival rules
        run: node tests/shockwave.cjs
      - name: Chicken physics and rendering
        run: node tests/chickens.cjs
      - name: Farm and ice maps, full-flock storage and 36 complete bot rounds
        run: node tests/farm-ice.cjs
      - name: Fruit memory rules
        run: node tests/fruit-memory.cjs
      - name: Auto-update and build tests
        run: node tests/auto-update.cjs
      - name: HTML-to-JavaScript references
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const html=fs.readFileSync('index.html','utf8');
          const js=fs.readFileSync('app.js','utf8');
          const ids=new Set([...html.matchAll(/\bid="([^"]+)"/g)].map(x=>x[1]));
          const used=[...js.matchAll(/\$\('([^']+)'\)/g)].map(x=>x[1]);
          const missing=[...new Set(used.filter(id=>!ids.has(id)))];
          if(missing.length){console.error('Missing HTML IDs:',missing.join(', '));process.exit(1);}
          for(const file of ['arena-art.js','style.css','amplify.yml','README.md','player-avatar.js','ghost-attack.js','chickens.js','fruit-memory.js','shockwave.js','host.html'])if(!fs.existsSync(file))throw Error('Missing '+file);
          console.log('Checked '+used.length+' ID references and static game assets');
          NODE

  board-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Restore BOARD PARTY v7 source assets
        run: node scripts/build-board-v7.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test tools
        run: |
          npm install --prefix /tmp/board-browser playwright@1.62.1
          /tmp/board-browser/node_modules/.bin/playwright install --with-deps chromium webkit
      - name: Real host and controller input, camera, and rendering
        env:
          NODE_PATH: /tmp/board-browser/node_modules
        run: |
          export CHROME_PATH="$(node -p "require('playwright').chromium.executablePath()")"
          node tests/farm-ice-browser.cjs
          BOARD_BROWSER=webkit node tests/farm-ice-browser.cjs
          node tests/board-browser.cjs
          node tests/mobile-host-lobby-browser.cjs
          node tests/lobby-stability-browser.cjs
          BOARD_BROWSER=webkit node tests/mobile-host-lobby-browser.cjs
          BOARD_BROWSER=webkit node tests/lobby-stability-browser.cjs
          node tests/board-startup.cjs
          BOARD_BROWSER=webkit node tests/board-startup.cjs
          node tests/ghost-courtyards-browser.cjs
          BOARD_BROWSER=webkit node tests/ghost-courtyards-browser.cjs
          node tests/pizza-kitchen-browser.cjs
          BOARD_BROWSER=webkit node tests/pizza-kitchen-browser.cjs
          node tests/party-arenas-browser.cjs
          BOARD_BROWSER=webkit node tests/party-arenas-browser.cjs
          node tests/map-scale-browser.cjs
          BOARD_BROWSER=webkit node tests/map-scale-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: board-expedition-screenshots
          path: /tmp/game-friends-board
