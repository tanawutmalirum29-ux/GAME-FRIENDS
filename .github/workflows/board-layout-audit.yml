name: BOARD PARTY layout audit
on:
  pull_request:
    paths:
      - 'src/board-party/runtime/board-map.js'
      - 'src/board-party/runtime/board-v7-adapter.js'
      - 'src/board-party/legacy/v7-source/**'
      - 'scripts/build-board-v7.cjs'
      - 'tests/board-build-fresh.cjs'
      - 'tests/board-runtime-layers.cjs'
      - 'tests/static-build-integrity.cjs'
      - 'src/board-party/runtime/board-art.js'
      - 'tests/board-layout-audit.cjs'
      - '.github/workflows/board-layout-audit.yml'
permissions:
  contents: read
jobs:
  island-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore authored BOARD design
        run: node scripts/build-board-v7.cjs
      - name: Print island density and route geometry
        run: node tests/board-layout-audit.cjs
      - name: Enforce BOARD PARTY v8 node, bridge and sword geometry
        run: node tests/board-v8-layout.cjs
