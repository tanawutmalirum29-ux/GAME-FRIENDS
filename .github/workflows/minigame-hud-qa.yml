name: Mini-game HUD QA
on:
  pull_request:
  push:
    branches: [main]
jobs:
  hud-regression:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/central-hud.test.cjs
      - run: node --test tests/farm-ice-fullwidth.test.cjs
