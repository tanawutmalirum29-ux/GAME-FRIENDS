name: COLOR SWITCH smoke and regression checks
on:
  push:
    branches: [main, feat/color-switch-game-5]
  pull_request:
    branches: [main]
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for source in app.js src/games/color-switch/color-switch-mayan.js src/games/color-switch/color-switch.js src/games/ghost-attack/ghost-attack.js src/games/chickens/chickens.js src/games/fruit-memory/fruit-memory.js src/games/shockwave/shockwave.js; do
            node --check "$source"
          done
      - name: BOARD PARTY geometry, camera and navigation regression
        run: |
          for source in board-*.js; do node --check "$source"; done
          node tests/board-party.cjs
          node tests/board-art.cjs
      - name: PIZZA TIME menu fairness and movement regression
        run: |
          node --check src/games/pizza-time/pizza-time.js
          node tests/pizza-time.test.cjs
      - name: KNIGHT MATCH physics, balloon and HUD regressions
        run: |
          node --check src/games/knight-match/knight-match.js
          node --check tests/knight-match.cjs
          node tests/knight-match.cjs
      - name: Test COLOR SWITCH core rules and stress
        run: node tests/color-switch.test.js
      - name: Mayan skull theme and 15 percent bot nerf
        run: node tests/color-switch-mayan.test.js
      - name: Shared character punches and 0.8-second colored stun
        run: node tests/combat-motion.cjs
      - name: Fruit Memory punch integration
        run: node tests/fruit-memory.cjs
      - name: Chickens punch and drop integration
        run: node tests/chickens.cjs
      - name: Full multiplayer smoke integration
        run: node tests/smoke.cjs
      - name: Shared art, Shockwave, avatar, auto-update and vector regressions
        run: |
          node tests/arena-art.cjs
          node tests/shockwave.cjs
          node tests/avatar-topdown.cjs
          node tests/auto-update.cjs
          node tests/svg-only-policy.cjs
      - name: Ensure fifth game is discovered without editing HTML
        run: |
          node tests/game-platform.cjs
          node -e "const m=require('./src/games/color-switch/manifest.json'); if(m.id!=='color_switch'||!m.modes.includes('normal')||!m.modes.includes('board'))process.exit(1)"
          ! grep -q 'src="./src/games/' index.html
          ! grep -q 'data-pick="' index.html
