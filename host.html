<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>จอเจ้าของห้อง | STICK SQUAD PARTY</title>
  <meta name="robots" content="noindex">
  <script>
    // Explicit host entrypoint. Ordinary root URLs and /?join=... stay controller-only.
    // This is a navigation boundary, not authentication; server-side auth is needed
    // to prevent a visitor deliberately forging a host URL.
    location.replace(new URL('./?host=1',location.href).href);
  </script>
</head>
<body style="margin:0;background:#0d1122;color:white;font:16px system-ui;padding:30px">
  <p>เปิดหน้าเจ้าของห้อง…</p>
  <p><a style="color:#83e1f6" href="./?host=1">เปิดจอเจ้าของห้อง</a></p>
</body>
</html>
