<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="-8 -8 80 80" role="img" aria-label="GAME FRIENDS mining helmet — top-down, band in player color" color="#36d9e5" data-cosmetic="mining-helmet" data-view="top" data-anchor="32 32" data-color-binding="root-color">
<title>GAME FRIENDS mining helmet — top-down, band in player color</title>
<desc>Transparent yellow hard-hat overlay worn toward the back of the head so both eyes stay visible. The round headlamp is mounted on the dome front, between the eyes (front is negative Y). Only the center stripe uses currentColor. Use the documented anchor 32 32.</desc>
<defs>
  <radialGradient id="gf-mine-top-shell" cx=".36" cy=".3" r=".85">
    <stop offset="0" stop-color="#fff3a6"/><stop offset=".38" stop-color="#ffd922"/>
    <stop offset=".78" stop-color="#e9ad00"/><stop offset="1" stop-color="#b57b00"/>
  </radialGradient>
  <radialGradient id="gf-mine-top-lens" cx=".5" cy=".42" r=".6">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#fff2a8"/><stop offset="1" stop-color="#e2a900"/>
  </radialGradient>
  <radialGradient id="gf-mine-top-glow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#fffbd0" stop-opacity=".85"/><stop offset="1" stop-color="#fff2a0" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="gf-mine-top-dome"><ellipse cx="32" cy="40" rx="24" ry="19"/></clipPath>
</defs>
<g stroke-linecap="round" stroke-linejoin="round">
  <g data-part="dome">
    <ellipse cx="32" cy="40" rx="24" ry="19" fill="url(#gf-mine-top-shell)" stroke="#8a6000" stroke-width=".9"/>
    <g clip-path="url(#gf-mine-top-dome)" fill="none">
      <path d="M22 24 Q20 40 24 58 M42 24 Q44 40 40 58" stroke="#b27a00" stroke-width="2.6" stroke-opacity=".55"/>
      <path d="M22 24 Q20 40 24 58 M42 24 Q44 40 40 58" stroke="#fff08a" stroke-width="1.5"/>
      <g data-part="center-stripe" data-color-source="currentColor">
        <rect x="28.8" y="32" width="6.4" height="32" fill="#101925" fill-opacity=".8" stroke="none"/>
        <rect x="29.5" y="32" width="5" height="32" fill="currentColor" stroke="none"/>
        <path d="M27.6 32 V60 M36.4 32 V60" stroke="#ffffff" stroke-width=".6" stroke-opacity=".8"/>
      </g>
    </g>
    <path d="M12 36 C13.5 28.5 20 24 27 23" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity=".7"/>
    <ellipse cx="20" cy="49" rx="5" ry="2.4" transform="rotate(-24 20 49)" fill="#ffffff" fill-opacity=".4"/>
  </g>
  <g data-part="headlamp">
    <circle cx="32" cy="19" r="7" fill="url(#gf-mine-top-glow)"/>
    <circle cx="32" cy="25" r="5.6" fill="#4a5262" stroke="#1c212b" stroke-width=".9"/>
    <circle cx="32" cy="25" r="4.5" fill="#8d97a9" stroke="#2a303c" stroke-width=".6"/>
    <circle cx="32" cy="25" r="3.5" fill="url(#gf-mine-top-lens)" stroke="#d9a400" stroke-width=".5"/>
    <circle cx="32" cy="25" r="1.2" fill="#ffffff"/>
    <path d="M29.4 23.4 Q30.7 22 32.5 21.9" fill="none" stroke="#ffffff" stroke-width=".7" stroke-opacity=".9"/>
  </g>
</g>
</svg>
