<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="-8 -8 80 80" role="img" aria-label="GAME FRIENDS mining helmet — top-down, band in player color" color="#36d9e5" data-cosmetic="mining-helmet" data-view="top" data-anchor="32 32" data-color-binding="root-color">
<title>GAME FRIENDS mining helmet — top-down, band in player color</title>
<desc>Transparent yellow hard-hat overlay with a headlamp on the front (negative Y). Yellow shell, gray lamp housing and warm light stay neutral. Only the center stripe uses currentColor. Use the documented anchor 32 32.</desc>
<defs>
  <radialGradient id="gf-mine-top-shell" cx=".36" cy=".3" r=".85">
    <stop offset="0" stop-color="#fff3a6"/><stop offset=".38" stop-color="#ffd922"/>
    <stop offset=".78" stop-color="#e9ad00"/><stop offset="1" stop-color="#b57b00"/>
  </radialGradient>
  <linearGradient id="gf-mine-top-bill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f3b800"/><stop offset="1" stop-color="#c78a00"/>
  </linearGradient>
  <radialGradient id="gf-mine-top-lens" cx=".5" cy=".42" r=".6">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#fff2a8"/><stop offset="1" stop-color="#e2a900"/>
  </radialGradient>
  <radialGradient id="gf-mine-top-glow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#fffbd0" stop-opacity=".85"/><stop offset="1" stop-color="#fff2a0" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="gf-mine-top-dome"><ellipse cx="32" cy="33.5" rx="24" ry="24"/></clipPath>
</defs>
<g stroke-linecap="round" stroke-linejoin="round">
  <path data-part="front-bill" d="M7.5 16 C7 5.5 18 0.2 32 0.2 C46 0.2 57 5.5 56.5 16 C46 11 18 11 7.5 16 Z" fill="url(#gf-mine-top-bill)" stroke="#7a5600" stroke-width=".9"/>
  <g data-part="dome">
    <ellipse cx="32" cy="33.5" rx="24" ry="24" fill="url(#gf-mine-top-shell)" stroke="#8a6000" stroke-width=".9"/>
    <g clip-path="url(#gf-mine-top-dome)" fill="none">
      <path d="M22.5 14 Q20 33 24 54 M41.5 14 Q44 33 40 54" stroke="#b27a00" stroke-width="2.6" stroke-opacity=".55"/>
      <path d="M22.5 14 Q20 33 24 54 M41.5 14 Q44 33 40 54" stroke="#fff08a" stroke-width="1.5"/>
      <g data-part="center-stripe" data-color-source="currentColor">
        <rect x="28.8" y="20" width="6.4" height="40" fill="#101925" fill-opacity=".8" stroke="none"/>
        <rect x="29.5" y="20" width="5" height="40" fill="currentColor" stroke="none"/>
        <path d="M27.6 20 V58 M36.4 20 V58" stroke="#ffffff" stroke-width=".6" stroke-opacity=".8"/>
      </g>
    </g>
    <path d="M12 26 C13.5 18 20 13 27 11.8" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity=".7"/>
    <ellipse cx="20" cy="44" rx="5" ry="2.6" transform="rotate(-24 20 44)" fill="#ffffff" fill-opacity=".4"/>
  </g>
  <g data-part="headlamp">
    <circle cx="32" cy="-1" r="11" fill="url(#gf-mine-top-glow)"/>
    <rect x="29.4" y="10" width="5.2" height="7" rx="2.6" fill="#3a4252" stroke="#1c212b" stroke-width=".7"/>
    <circle cx="32" cy="5.6" r="7" fill="#4a5262" stroke="#1c212b" stroke-width=".9"/>
    <circle cx="32" cy="5.6" r="5.6" fill="#8d97a9" stroke="#2a303c" stroke-width=".6"/>
    <circle cx="32" cy="5.6" r="4.4" fill="url(#gf-mine-top-lens)" stroke="#d9a400" stroke-width=".5"/>
    <circle cx="32" cy="5.6" r="1.6" fill="#ffffff"/>
    <path d="M28.6 3.4 Q30.2 1.6 32.6 1.5" fill="none" stroke="#ffffff" stroke-width=".8" stroke-opacity=".9"/>
  </g>
</g>
</svg>
