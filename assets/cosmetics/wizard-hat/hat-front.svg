<title>GAME FRIENDS wizard hat — front, hat body in player color</title>
<desc>Transparent hat overlay. Hat body and brim use currentColor; gold band, stars and bell stay neutral. Top-down forward is negative Y; the tip droops toward positive Y so the eye marks stay visible.</desc>
