<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="-8 -8 80 80" role="img" aria-label="GAME FRIENDS wizard hat — top-down, hat body in player color" color="#36d9e5" data-cosmetic="wizard-hat" data-view="top-down" data-anchor="32 32" data-color-binding="root-color">
<title>GAME FRIENDS wizard hat — top-down, hat body in player color</title>
<desc>Transparent hat overlay. Hat body and brim use currentColor; gold band, stars and bell stay neutral. Top-down forward is negative Y; the tip droops toward positive Y so the eye marks stay visible.</desc>
<defs>
