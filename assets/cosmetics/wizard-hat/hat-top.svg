    <stop offset="0" stop-color="#f6df8a"/><stop offset=".5" stop-color="#c9a227"/><stop offset="1" stop-color="#8a6a12"/>
  </linearGradient>
  <radialGradient id="gf-wizard-top-shade" cx=".35" cy=".25" r=".9">
    <stop offset="0" stop-color="#ffffff" stop-opacity=".38"/><stop offset=".45" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset="1" stop-color="#000000" stop-opacity=".45"/>
  </radialGradient>
  <linearGradient id="gf-wizard-top-cone" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#000000" stop-opacity=".38"/><stop offset=".38" stop-color="#ffffff" stop-opacity=".22"/>
    <stop offset=".7" stop-color="#000000" stop-opacity="0"/><stop offset="1" stop-color="#000000" stop-opacity=".5"/>
  </linearGradient>
</defs>
<g stroke-linecap="round" stroke-linejoin="round">
