  <linearGradient id="gf-jest-front-cuff" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffe58a"/><stop offset=".5" stop-color="#f3bd1f"/><stop offset="1" stop-color="#b8860b"/>
  </linearGradient>
