<title>GAME FRIENDS jester hat — front, player color alternating with gold</title>
<desc>Transparent two-horned jester hat with gold bells. Segments alternate between player color (currentColor) and fixed gold; bells, cuff and outlines stay neutral. The cuff ends above the eyes. Use the documented anchor 48 48, not the padded center.</desc>
