<title>GAME FRIENDS jester hat — top-down, player color alternating with gold</title>
<desc>Transparent two-horned jester hat seen from above; horns sweep left and right with gold bells. Segments alternate between player color (currentColor) and fixed gold. Forward is negative Y. Use the documented anchor 32 32.</desc>
