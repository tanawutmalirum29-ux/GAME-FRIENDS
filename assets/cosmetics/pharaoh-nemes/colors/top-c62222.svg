<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="-8 -8 80 80" role="img" aria-label="GAME FRIENDS pharaoh nemes — top-down; gold alternating with player-color stripes" color="#c62222" data-cosmetic="pharaoh-nemes" data-view="top-down" data-anchor="32 32">
<title>GAME FRIENDS pharaoh nemes — top-down; gold alternating with player-color stripes</title>
<desc>Transparent nemes headdress overlay. Gold stripes, brow band and cobra stay gold. Only the intervening cloth stripes use currentColor from the root color attribute. In overhead view the face points toward negative Y, the striped fan covers the back of the head toward positive Y, and the cobra sits on the forward brow band. No avatar or background is embedded.</desc>
