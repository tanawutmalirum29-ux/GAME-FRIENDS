<svg xmlns="http://www.w3.org/2000/svg" width="96" height="104" viewBox="0 -4 96 104" role="img" aria-label="GAME FRIENDS paper bag mask — front, fixed cream paper and black ink" data-cosmetic="paper-bag-mask" data-view="front" data-anchor="48 48" data-color-mode="fixed">
<title>GAME FRIENDS paper bag mask — front, fixed cream paper and black ink</title>
<desc>Opaque folded cream paper mask with black cross eyes, a curved black smile and a jagged lower edge. No tint or player-color binding. Gaps at the hem and between roof flaps show the real avatar beneath, with no painted red. In overhead view mouth and jagged hem face negative Y; the folded roof is behind toward positive Y. No avatar or background is embedded.</desc>
