<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="-8 -8 80 80" role="img" aria-label="GAME FRIENDS cowboy hat — top-down, band in player color" color="#36d9e5" data-cosmetic="cowboy-hat" data-view="top-down" data-anchor="32 32" data-color-binding="root-color">
<title>GAME FRIENDS cowboy hat — top-down, band in player color</title>
