<title>GAME FRIENDS dark shades, white moustache and beard — top-down, fixed colors</title>
<desc>Transparent accessory overlay with fixed charcoal sunglasses and neutral white moustache, beard and sideburns. No player-color binding. Overhead face and beard point toward negative Y; the nose cutout opens forward toward the moustache and beard; the continuous brow rim faces the forehead and glasses temples extend backward. No avatar or background is embedded.</desc>
