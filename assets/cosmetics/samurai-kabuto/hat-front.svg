<svg xmlns="http://www.w3.org/2000/svg" width="120" height="158" viewBox="-12 -62 120 158" role="img" aria-label="GAME FRIENDS samurai kabuto — front, lacing and side flaps in player color" color="#36d9e5" data-cosmetic="samurai-kabuto" data-view="front" data-anchor="48 48" data-color-binding="root-color">
<title>GAME FRIENDS samurai kabuto — front, lacing and side flaps in player color</title>
<desc>Transparent hat overlay. Black lacquer bowl, gold horns and trim stay neutral. Only the lacing cords and the turned-back side flaps use currentColor. Top-down forward is negative Y; the bowl sits behind the eye marks so they stay visible.</desc>
