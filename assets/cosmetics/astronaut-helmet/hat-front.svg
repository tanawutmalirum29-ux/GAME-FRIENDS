    <stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#eef1f6"/>
    <stop offset=".7" stop-color="#cdd4de"/><stop offset="1" stop-color="#98a2b3"/>
  </radialGradient>
  <linearGradient id="gf-astro-front-glass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0b1740" stop-opacity=".55"/>
    <stop offset=".5" stop-color="#27468a" stop-opacity=".28"/>
    <stop offset="1" stop-color="#6f93d0" stop-opacity=".16"/>
  </linearGradient>
  <linearGradient id="gf-astro-front-collar" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#dde2ea"/><stop offset=".5" stop-color="#aab3c1"/><stop offset="1" stop-color="#6f7a8b"/>
  </linearGradient>
  <clipPath id="gf-astro-front-dome"><path d="M48-3 C76-3 92 17 92 44 C92 66 82 80 70 84 L26 84 C14 80 4 66 4 44 C4 17 20-3 48-3 Z"/></clipPath>
</defs>
<g stroke-linecap="round" stroke-linejoin="round">
