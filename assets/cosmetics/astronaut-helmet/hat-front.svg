<svg xmlns="http://www.w3.org/2000/svg" width="120" height="116" viewBox="-12 -20 120 116" role="img" aria-label="GAME FRIENDS astronaut helmet — front, trim in player color" color="#36d9e5" data-cosmetic="astronaut-helmet" data-view="front" data-anchor="48 48" data-color-binding="root-color">
<title>GAME FRIENDS astronaut helmet — front, trim in player color</title>
<desc>Transparent full-helmet overlay. White shell, gray collar and tinted glass stay neutral. Only the crown stripe, ear pads and collar band use currentColor. The visor window is open with light tinted glass so the character's eyes remain visible. Use the documented anchor 48 48, not the padded center.</desc>
<defs>
