    <path d="M48-3 C76-3 92 17 92 44 C92 66 82 80 70 84 L26 84 C14 80 4 66 4 44 C4 17 20-3 48-3 Z M15 40 C15 25 29 19 48 19 C67 19 81 25 81 40 L81 56 C81 69 67 77 48 77 C29 77 15 69 15 56 Z" fill="url(#gf-astro-front-shell)" fill-rule="evenodd" stroke="#59627a" stroke-width="1"/>
    <g clip-path="url(#gf-astro-front-dome)" data-part="crown-stripe" data-color-source="currentColor">
      <rect x="41.8" y="-4" width="12.4" height="24" fill="#101925" fill-opacity=".8"/>
      <rect x="42.6" y="-4" width="10.8" height="24" fill="currentColor"/>
      <path d="M40.2 -4 V20 M55.8 -4 V20" fill="none" stroke="#ffffff" stroke-width=".9" stroke-opacity=".85"/>
    </g>
    <path d="M9 36 C8 22 18 8 34 2 M60 0.6 C68 2.5 74 7 78 13" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-opacity=".7"/>
    <path d="M10 62 Q14 72 24 78 M86 62 Q82 72 72 78" fill="none" stroke="#6b7586" stroke-width=".8" stroke-opacity=".5"/>
  </g>
  <g data-part="visor">
    <path d="M15 40 C15 25 29 19 48 19 C67 19 81 25 81 40 L81 56 C81 69 67 77 48 77 C29 77 15 69 15 56 Z" fill="url(#gf-astro-front-glass)" stroke="#2a303c" stroke-width="3.6"/>
    <path d="M15 40 C15 25 29 19 48 19 C67 19 81 25 81 40 L81 56 C81 69 67 77 48 77 C29 77 15 69 15 56 Z" fill="none" stroke="#9aa6bb" stroke-width=".7" stroke-opacity=".6" transform="translate(48 48) scale(.94) translate(-48 -48)"/>
    <path d="M23 36 C25 29 33 25 41 24" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-opacity=".55"/>
    <path d="M47 24 C55 24 61 26 65 29" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity=".35"/>
    <path d="M72 38 L72 50" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity=".25"/>
