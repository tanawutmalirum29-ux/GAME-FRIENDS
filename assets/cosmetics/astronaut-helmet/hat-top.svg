<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="-8 -8 80 80" role="img" aria-label="GAME FRIENDS astronaut helmet — top-down, trim in player color" color="#36d9e5" data-cosmetic="astronaut-helmet" data-view="top" data-anchor="32 32" data-color-binding="root-color">
<title>GAME FRIENDS astronaut helmet — top-down, trim in player color</title>
<desc>Transparent full-helmet overlay. White shell, gray hardware and tinted glass stay neutral. Only the center stripe, side comm pads and rear light use currentColor. Visor faces negative Y and is translucent so the eyes stay visible. Use the documented anchor 32 32.</desc>
<defs>
  <radialGradient id="gf-astro-top-shell" cx=".36" cy=".3" r=".85">
    <stop offset="0" stop-color="#ffffff"/><stop offset=".4" stop-color="#eef1f6"/>
    <stop offset=".78" stop-color="#c6cdd9"/><stop offset="1" stop-color="#8e98a9"/>
  </radialGradient>
  <linearGradient id="gf-astro-top-glass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0b1740" stop-opacity=".5"/>
    <stop offset=".6" stop-color="#27468a" stop-opacity=".26"/>
    <stop offset="1" stop-color="#5f86c8" stop-opacity=".16"/>
  </linearGradient>
  <linearGradient id="gf-astro-top-pack" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9aa3b2"/><stop offset="1" stop-color="#5a6372"/>
  </linearGradient>
  <clipPath id="gf-astro-top-dome"><ellipse cx="32" cy="30.5" rx="27.5" ry="28"/></clipPath>
</defs>
<g stroke-linecap="round" stroke-linejoin="round">
  <g data-part="rear-life-support">
    <rect x="23.5" y="54" width="17" height="8.5" rx="3.2" fill="url(#gf-astro-top-pack)" stroke="#3b4351" stroke-width=".8"/>
    <rect x="28" y="57.6" width="8" height="2.2" rx="1.1" fill="currentColor" data-color-source="currentColor"/>
  </g>
  <g data-part="shell">
    <path d="M4.5 30.5 A27.5 28 0 1 1 59.5 30.5 A27.5 28 0 1 1 4.5 30.5 Z M13 21 C12.5 11 21 5.6 32 5.6 C43 5.6 51.5 11 51 21 C44 25 20 25 13 21 Z" fill="url(#gf-astro-top-shell)" fill-rule="evenodd" stroke="#59627a" stroke-width=".9"/>
    <path d="M9 40 Q32 47 55 40 M12 47 Q32 53 52 47" fill="none" stroke="#8f99aa" stroke-width=".6" stroke-opacity=".6"/>
    <g clip-path="url(#gf-astro-top-dome)" data-part="center-stripe" data-color-source="currentColor">
      <rect x="28.8" y="25" width="6.4" height="36" fill="#101925" fill-opacity=".8"/>
      <rect x="29.5" y="25" width="5" height="36" fill="currentColor"/>
      <path d="M27.6 25 V58 M36.4 25 V58" fill="none" stroke="#ffffff" stroke-width=".7" stroke-opacity=".85"/>
    </g>
    <path d="M9.5 24 C11 13 19 6.5 28 4.6" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-opacity=".75"/>
    <ellipse cx="21" cy="40" rx="6" ry="3" transform="rotate(-24 21 40)" fill="#ffffff" fill-opacity=".45"/>
  </g>
  <g data-part="visor">
    <path d="M13 21 C12.5 11 21 5.6 32 5.6 C43 5.6 51.5 11 51 21 C44 25 20 25 13 21 Z" fill="url(#gf-astro-top-glass)" stroke="#2a303c" stroke-width="1.5"/>
    <path d="M13 21 C12.5 11 21 5.6 32 5.6 C43 5.6 51.5 11 51 21 C44 25 20 25 13 21 Z" fill="none" stroke="#9aa6bb" stroke-width=".5" stroke-opacity=".55" transform="translate(32 15) scale(.94) translate(-32 -15)"/>
    <path d="M17 11.5 Q22 7.8 29 7.2" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-opacity=".6"/>
    <path d="M35 7.3 Q40 7.8 44 10" fill="none" stroke="#ffffff" stroke-width=".8" stroke-opacity=".35"/>
  </g>
  <g data-part="side-comm-pads" data-color-source="currentColor">
    <circle cx="4" cy="31" r="4.4" fill="#4a5262" stroke="#262c37" stroke-width=".8"/>
    <circle cx="2.9" cy="31" r="2.1" fill="currentColor"/>
    <circle cx="60" cy="31" r="4.4" fill="#4a5262" stroke="#262c37" stroke-width=".8"/>
    <circle cx="61.1" cy="31" r="2.1" fill="currentColor"/>
  </g>
</g>
</svg>
