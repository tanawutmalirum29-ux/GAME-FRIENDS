<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="-8 -8 80 80" role="img" aria-label="GAME FRIENDS viking helmet — top-down, center crest in player color" color="#36d9e5" data-cosmetic="viking-helmet" data-view="top-down" data-anchor="32 32" data-color-binding="root-color">
<title>GAME FRIENDS viking helmet — top-down, center crest in player color</title>
<desc>Transparent hat overlay. Steel dome, gold rim and bone horns stay neutral. Only the center crest stripe uses currentColor. Dome sits behind the eye patches so the face marks stay visible. Top-down forward is negative Y.</desc>
