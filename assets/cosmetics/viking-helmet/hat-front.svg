<svg xmlns="http://www.w3.org/2000/svg" width="120" height="132" viewBox="-12 -36 120 132" role="img" aria-label="GAME FRIENDS viking helmet — front, center crest in player color" color="#36d9e5" data-cosmetic="viking-helmet" data-view="front" data-anchor="48 48" data-color-binding="root-color">
<title>GAME FRIENDS viking helmet — front, center crest in player color</title>
<desc>Transparent hat overlay. Steel dome, gold rim and bone horns stay neutral. Only the center crest stripe uses currentColor. Padding preserves the original head scale; use the documented anchor, not the padded image center. Lower edge stays above the eye marks.</desc>
