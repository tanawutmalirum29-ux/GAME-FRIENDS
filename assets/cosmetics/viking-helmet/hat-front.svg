  </linearGradient>
  <linearGradient id="gf-viking-front-gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f6df8a"/><stop offset=".45" stop-color="#c9a227"/><stop offset="1" stop-color="#8a6a12"/>
  </linearGradient>
  <linearGradient id="gf-viking-front-guard" x1="0" y1="0" x2="1" y2="0">
