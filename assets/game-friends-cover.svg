 <g transform="translate(550 570)"><circle cy="-34" r="31" fill="#ffd72b"/><path d="M-7-1l-23 48m23-48 23 48M-8 8l-42 21M-8 8l38 20" fill="none" stroke="#ffd72b" stroke-width="17"/></g>
 <g transform="translate(658 565)"><circle cy="-34" r="31" fill="#38d774"/><path d="M-7-1l-23 48m23-48 23 48M-8 8l-42 21M-8 8l38 20" fill="none" stroke="#38d774" stroke-width="17"/></g>
</g>
<!-- central branded badge -->
<g filter="url(#shadow)">
 <rect x="325" y="165" width="550" height="277" rx="53" fill="url(#purple)" stroke="#f0d6ff" stroke-width="10"/>
 <rect x="347" y="183" width="506" height="231" rx="36" fill="#191a67" stroke="#6fbcff" stroke-width="6"/>
 <path d="M559 179l15-33 26 20 29-20 15 33Z" fill="#ffda4d" stroke="#fff7b6" stroke-width="7"/>
 <text x="600" y="287" text-anchor="middle" fill="url(#logo)" font-family="Arial Black,Arial,sans-serif" font-weight="1000" font-size="104" letter-spacing="-4" stroke="#11184d" stroke-width="10" paint-order="stroke fill">GAME</text>
 <text x="600" y="388" text-anchor="middle" fill="url(#gold)" font-family="Arial Black,Arial,sans-serif" font-weight="1000" font-size="98" letter-spacing="-5" stroke="#251146" stroke-width="11" paint-order="stroke fill">FRIENDS</text>
 <rect x="413" y="412" width="374" height="49" rx="20" fill="#6a39d1" stroke="#d8b8ff" stroke-width="5"/>
 <text x="600" y="446" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="25" fill="#fff">MULTIPLAYER PARTY GAMES</text>
