<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">GAME FRIENDS — Multiplayer Party Games</title>
<desc id="desc">Colorful six-game party cover with Ghost Attack, Chickens, Fruit Memory, Shockwave, Color Switch and Pizza Time.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#251152"/><stop offset=".52" stop-color="#121946"/><stop offset="1" stop-color="#09537a"/></linearGradient>
 <linearGradient id="logo" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset=".45" stop-color="#d7efff"/><stop offset="1" stop-color="#92bbff"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff6a5"/><stop offset=".53" stop-color="#ffce30"/><stop offset="1" stop-color="#fb7d20"/></linearGradient>
 <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9655ff"/><stop offset="1" stop-color="#3a0f91"/></linearGradient>
 <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#46d6ff"/><stop offset="1" stop-color="#1249e6"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="9" stdDeviation="11" flood-color="#050b2c" flood-opacity=".85"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="7"/></filter>
 <pattern id="tiles" width="45" height="45" patternUnits="userSpaceOnUse"><path d="M45 0H0V45" fill="none" stroke="#fff" stroke-opacity=".23" stroke-width="2"/></pattern>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/>
