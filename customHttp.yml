# Hosted assets are refreshed by revalidating index.html and the manifest.
customHeaders:
  - pattern: '/'
    headers:
      - key: Cache-Control
        value: 'no-cache, max-age=0, s-maxage=0, must-revalidate'
  - pattern: '/*.html'
    headers:
      - key: Cache-Control
        value: 'no-cache, max-age=0, s-maxage=0, must-revalidate'
  - pattern: '/deployment.json'
    headers:
      - key: Cache-Control
        value: 'no-store, max-age=0, s-maxage=0'
  - pattern: '/runtime-config.js'
    headers:
      - key: Cache-Control
        value: 'no-cache, max-age=0, s-maxage=0, must-revalidate'
  # All mutable catalog endpoints must be revalidated even when a PWA resumes.
  # Content-addressed /game-assets and /board-map-assets remain immutable.
  - pattern: '/game-catalog.json'
    headers:
      - key: Cache-Control
        value: 'no-store, max-age=0, s-maxage=0'
  - pattern: '/board-map-catalog.json'
    headers:
      - key: Cache-Control
        value: 'no-store, max-age=0, s-maxage=0'
  - pattern: '/board-system-catalog.json'
    headers:
      - key: Cache-Control
        value: 'no-store, max-age=0, s-maxage=0'
  - pattern: '**/*.js'
    headers:
      - key: Cache-Control
        value: 'no-cache, max-age=0, must-revalidate'
  - pattern: '**/*.css'
    headers:
      - key: Cache-Control
        value: 'no-cache, max-age=0, must-revalidate'
