# Security headers apply to every successful static response. The CSP allows
# the same-origin runtime, inline static UI, pinned jsDelivr libraries, QR
# camera assets and the HTTPS/WSS connections used by the game.
customHeaders:
  - pattern: '/'
    headers:
      - key: Cache-Control
        value: 'no-cache, max-age=0, s-maxage=0, must-revalidate'
  - pattern: '/*.html'
    headers:
      - key: Cache-Control
        value: 'no-cache, max-age=0, s-maxage=0, must-revalidate'
  - pattern: '/deployment.json'
    headers:
      - key: Cache-Control
        value: 'no-store, max-age=0, s-maxage=0'
  - pattern: '/runtime-config.js'
    headers:
      - key: Cache-Control
        value: 'no-cache, max-age=0, s-maxage=0, must-revalidate'
  # Mutable catalogs must be revalidated after a deployment.
  - pattern: '/game-catalog.json'
    headers:
      - key: Cache-Control
        value: 'no-store, max-age=0, s-maxage=0'
  - pattern: '/board-map-catalog.json'
    headers:
      - key: Cache-Control
        value: 'no-store, max-age=0, s-maxage=0'
  - pattern: '/board-system-catalog.json'
    headers:
      - key: Cache-Control
        value: 'no-store, max-age=0, s-maxage=0'
  # Security policy is deliberately separate from path-specific cache policy.
  - pattern: '**/*'
    headers:
      - key: Strict-Transport-Security
        value: 'max-age=31536000'
      - key: X-Content-Type-Options
        value: 'nosniff'
      - key: Referrer-Policy
        value: 'strict-origin-when-cross-origin'
      - key: X-Frame-Options
        value: 'SAMEORIGIN'
      - key: Permissions-Policy
        value: 'camera=(self), microphone=(self), geolocation=(), fullscreen=(self)'
      - key: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https: wss: ws:; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'self'; object-src 'none'; base-uri 'self'"
