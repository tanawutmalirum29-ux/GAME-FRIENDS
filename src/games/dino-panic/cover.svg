 <circle cx="146" cy="52" r="8" fill="#fff6c0" stroke="#173a12" stroke-width="2"/><ellipse cx="148" cy="52" rx="2" ry="5.5" fill="#111" stroke="none"/>
 <path d="M134 44 L156 46" stroke="#173a12" stroke-width="3" fill="none" stroke-linecap="round"/>
 <!-- tiny arm -->
 <path d="M118 96 L132 104 L128 110 L114 104 Z" fill="#4f9f3d" stroke-width="2"/>
 <!-- front leg (stomping) -->
 <path d="M84 108 C98 112 104 124 100 134 L104 146 L134 148 L132 154 L92 154 L82 138 C76 128 76 114 84 108 Z" fill="#3f8c33"/>
 <g fill="#f4e9cf" stroke="#8a7762" stroke-width="1.2"><path d="M124 150 L134 150 L132 156 Z M112 150 L120 150 L118 156 Z"/></g>
</g>
