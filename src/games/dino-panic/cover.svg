<g id="dp-c"><rect x="-10" y="-10" width="20" height="20" rx="2" fill="#c98a48" stroke="#4a2c12" stroke-width="1.6"/><rect x="-9" y="-9" width="18" height="18" fill="none" stroke="#3d6bb0" stroke-width="2.6"/><path d="M-7 -7 L7 7 M7 -7 L-7 7" stroke="#8a5428" stroke-width="1.6" opacity=".6"/></g>
