<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9a4ff"/><stop offset="1" stop-color="#ffb6dc"/></linearGradient>
<pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="5" cy="6" r="1.8" fill="#fff" opacity=".4"/><circle cx="15" cy="15" r="1.3" fill="#fff" opacity=".3"/></pattern>
<pattern id="cane" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="14" fill="#fff"/><rect x="7" width="7" height="14" fill="#ff4f7a"/></pattern>
<pattern id="tile" width="60" height="60" patternUnits="userSpaceOnUse" x="40" y="36"><rect width="30" height="30" fill="#ffd9ec"/><rect x="30" width="30" height="30" fill="#d9efff"/><rect y="30" width="30" height="30" fill="#fff0d2"/><rect x="30" y="30" width="30" height="30" fill="#e6dcff"/></pattern>
<radialGradient id="ball" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#14172f" stop-opacity="0"/><stop offset="0" stop-color="#59608e"/><stop offset="1" stop-color="#14172f"/></radialGradient>
</defs>
<rect width="320" height="180" fill="url(#bg)"/><rect width="320" height="180" fill="url(#dots)"/>
